name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -v

  deploy:
    name: Build e deploy na VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build -t minha-app:${{ github.sha }} .
          docker save -o /tmp/minha-app.tar minha-app:${{ github.sha }}

      - name: Copiar imagem para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "minha-app.tar"
          target: "/tmp""

      - name: Carregar imagem e subir container na VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            docker load -i /tmp/minha-app.tar
            docker stop minha-app || true
            docker rm minha-app || true
            docker run -d --name minha-app -p 8000:8000 --restart unless-stopped minha-app:${{ github.sha }}
            docker image prune -f
            rm /tmp/minha-app.tar
